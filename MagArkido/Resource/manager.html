<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagArkido Pattern Manager</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>

<!-- ── Main view ─────────────────────────────────────── -->
<div id="shell">
  <header id="topbar">
    <span id="logo">MAGARKIDO</span>
    <span id="tsub">v0.5.0</span>
    <button class="hbtn" onclick="su('importMgzSession')" title="Load a .mgz file into this session">&#128194; Load .mgz</button>
    <button class="hbtn" onclick="newPattern()" title="New pattern">&#43; New</button>
    <button class="hbtn" id="edit-ptn-btn" onclick="openEditor()" title="Edit selected pattern" disabled>&#9998; Edit Pattern</button>
    <button class="hbtn danger-btn" onclick="deleteSel()" title="Delete selected objects from model">&#128465; Delete</button>
  </header>

  <!-- Loaded files bar -->
  <div id="filesbar">
    <span class="files-lbl">Loaded:</span>
    <div id="file-chips"></div>
    <span class="files-empty hidden" id="files-empty">No files loaded — use Load .mgz above</span>
  </div>

  <div id="body">
    <nav id="rail">
      <div id="rail-cats"></div>
      <div class="rail-gap"></div>
      <button class="cbtn" data-cat="auto" onclick="selCat(this)"><span class="cico">&#9889;</span><span class="clbl">Auto</span></button>
    </nav>
    <div id="pane">
      <div id="gwrap"><div id="grid"></div></div>
      <div id="applyrow">
        <div id="sel-chips-wrap">
          <div id="sel-chips"></div>
          <span id="no-sel-hint" class="no-sel-hint"></span>
        </div>
        <button id="nodtlbtn" class="toggle-btn" onclick="toggleNoDetail()" title="Strip all detail lines when applying">No Detail</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Visual Editor (full-screen takeover) ──────────── -->
<div id="edov" class="hidden">

  <div id="edtop">
    <input type="text" id="ptn-name" placeholder="Pattern name">
    <select id="ptn-cat" onchange="onCatChange(this)"></select>
    <select id="ptn-sel" onchange="switchToPattern(this.value)" title="Switch pattern"></select>
    <span id="src-file-badge" class="src-file"></span>
    <button class="undo-btn" id="undo-btn" onclick="undoEditor()" title="Undo last change" disabled>&#8617;</button>
    <button class="absorb-ed-btn" onclick="su('absorb')" title="Absorb selected group's sub-groups">&#9673; Absorb</button>
    <button class="save-btn" onclick="savePattern()">Save</button>
    <button class="export-btn" onclick="exportMgz()" title="Export as .mgz file to a chosen location">&#8595; Export</button>
    <button class="x-btn" onclick="closeEditor()">&#10005;</button>
  </div>

  <div id="edbody">
    <div id="blocklist">
      <div id="blitems"></div>
      <div id="blbtns">
        <button id="bladd" onclick="addBlock()">+ Add Block</button>
        <button id="bldup" onclick="duplicateBlock()">&#10697; Duplicate</button>
        <div id="blmove">
          <button id="blup" onclick="moveBlock(-1)" title="Move block up">&#8593; Up</button>
          <button id="bldown" onclick="moveBlock(1)" title="Move block down">&#8595; Down</button>
        </div>
      </div>
    </div>
    <div id="inspector"><p class="no-sel">Select a block to edit</p></div>
    <div id="canvas-area">
      <canvas id="iso-canvas"></canvas>
      <div id="canvas-ctrl">
        <div id="canvas-ctrl-row">
          <button class="rand-btn rot-btn" onclick="canvasRot=(canvasRot+3)%4;drawISO()" title="Rotate left">&#9664;</button>
          <button class="rand-btn rot-btn" onclick="canvasRot=(canvasRot+1)%4;drawISO()" title="Rotate right">&#9654;</button>
          <button class="rand-btn" onclick="randomize()">&#127922; Rnd</button>
          <button class="rand-btn" onclick="drawISO()" title="Redraw canvas">&#8635;</button>
          <button class="rand-btn test-btn" id="test-btn" onclick="testPattern()">&#9654; Test</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ── Help overlay ───────────────────────────────────── -->
<div id="helpov" class="hidden" onclick="this.classList.add('hidden')">
  <div id="helpbox" onclick="event.stopPropagation()">
    <h3>Expression reference</h3>
    <table class="htbl">
      <tr><th>Token</th><th>Meaning</th></tr>
      <tr><td>r1, r2, r3</td><td>Random 0 or 1 (re-rolled per building)</td></tr>
      <tr><td>lv(t,3.5)</td><td>Floor count — target height ÷ floor height</td></tr>
    </table>
    <p>Combine freely: <code>"r1*10+20"</code>, <code>"lv(t,3)+r2*2"</code></p>
    <p style="font-size:11px;opacity:.6;margin-top:8px">Click anywhere to close</p>
  </div>
</div>

<script>
// ── Safe SketchUp bridge ──────────────────────────────
function su(fn, arg) {
  try { if(typeof sketchup!=='undefined') arg!==undefined?sketchup[fn](arg):sketchup[fn](); }
  catch(e){ console.warn('su:',fn,e); }
}

// ── Session state ─────────────────────────────────────
var patterns = {};
var loadedFiles = []; // [{name, path, clrs, ptns}]
var edClrs = {};      // current material palette for the editor

// Normalise CLRS values to hex strings (source files may use integers)
function normalizeClrs(clrs) {
  var result = {};
  Object.keys(clrs || {}).forEach(function(k) {
    var v = clrs[k];
    if (typeof v === 'number') {
      result[k] = '#' + ('000000' + (v & 0xFFFFFF).toString(16)).slice(-6);
    } else if (typeof v === 'string') {
      result[k] = v.charAt(0) === '#' ? v : '#' + v;
    }
  });
  return result;
}

function initPatterns() {
  patterns = window.magarkidoPatterns || {};
  loadedFiles = window.magarkidoFiles || [];
  edClrs = normalizeClrs(window.magarkidoClrs || {});
  if (!Object.keys(edClrs).length) edClrs = {BDY:'#5b85a8', SLD:'#4e5e6e'};
  renderFiles();
  renderNav();
  renderGrid();
  updateEditBtn();
}

// ── Loaded files bar ──────────────────────────────────
function renderFiles() {
  var el = document.getElementById('file-chips');
  var empty = document.getElementById('files-empty');
  el.innerHTML = '';
  if (!loadedFiles.length) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  loadedFiles.forEach(function(f) {
    var chip = document.createElement('div');
    chip.className = 'file-chip';
    var name = document.createElement('span');
    name.className = 'file-chip-name';
    name.title = f.path;
    name.textContent = f.name;
    var xBtn = document.createElement('button');
    xBtn.className = 'file-chip-x';
    xBtn.title = 'Remove from session';
    xBtn.textContent = '×';
    xBtn.addEventListener('click', (function(p){ return function(){ offloadFile(p); }; })(f.path));
    chip.appendChild(name);
    chip.appendChild(xBtn);
    el.appendChild(chip);
  });
}

function offloadFile(path) {
  su('offloadFile', JSON.stringify(path));
}

// ── Refresh all (called after load / offload / save) ──
function refreshAll(newPtns, newFiles, newClrs) {
  patterns = newPtns;
  loadedFiles = newFiles;
  edClrs = normalizeClrs(newClrs || {});
  if (!Object.keys(edClrs).length) edClrs = {BDY:'#5b85a8', SLD:'#4e5e6e'};
  renderFiles();
  renderNav();
  renderGrid();
  updateEditBtn();
  closeEditor();
}

// ── Main view ─────────────────────────────────────────
var selCatName = 'auto', selKeys = [];
var CAT_ICONS = {Skyscraper:'🏙',TierBuilding:'🏢',Apartment:'🏬',Villa:'🏡'};

function renderNav() {
  var container = document.getElementById('rail-cats');
  container.innerHTML = '';
  Object.keys(patterns).forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'cbtn' + (cat === selCatName ? ' active' : '');
    btn.dataset.cat = cat;
    btn.onclick = function(){ selCat(btn); };
    var ico = CAT_ICONS[cat] || '📁';
    btn.innerHTML = '<span class="cico">'+ico+'</span><span class="clbl">'+cat+'</span>';
    container.appendChild(btn);
  });
  if (selCatName !== 'auto' && !patterns[selCatName]) {
    selCatName = 'auto';
    document.querySelectorAll('.cbtn').forEach(function(b){
      b.classList.toggle('active', b.dataset.cat === 'auto');
    });
  }
  var sel = document.getElementById('ptn-cat');
  var prev = sel.value;
  sel.innerHTML = Object.keys(patterns).map(function(c){
    return '<option'+(c===prev?' selected':'')+'>'+c+'</option>';
  }).join('') + '<option value="__new__">＋ New category…</option>';
  refreshPtnSel();
}

function onCatChange(sel) {
  if (sel.value !== '__new__') { refreshPtnSel(); return; }
  var name = (prompt('New category name:') || '').trim();
  if (name) {
    patterns[name] = patterns[name] || {};
    renderNav();
    sel.value = name;
  } else {
    sel.value = Object.keys(patterns)[0] || '';
  }
  refreshPtnSel();
}

function selCat(btn) {
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  selCatName = btn.dataset.cat;
  renderGrid();
  updateEditBtn();
}

function updateEditBtn() {
  var btn = document.getElementById('edit-ptn-btn');
  if (!btn) return;
  var canEdit = selCatName !== 'auto' && Object.keys(patterns[selCatName] || {}).length > 0;
  btn.disabled = !canEdit;
}

function renderGrid() {
  var g = document.getElementById('grid');
  g.innerHTML = '';
  if (selCatName === 'auto') {
    g.innerHTML = '<div class="auto-info"><div class="auto-ico">⚡</div>'
      +'<div class="auto-ttl">Auto-Select by Height &amp; Type</div>'
      +'<div class="auto-dsc">Each group or component is assigned a pattern automatically based on its height and entity type:</div>'
      +'<table class="atbl"><tr><th>Type</th><th>Height</th><th>Pool</th></tr>'
      +'<tr><td>Group</td><td>&gt;24m</td><td>Skyscraper</td></tr>'
      +'<tr><td>Group</td><td>≤24m</td><td>TierBuilding</td></tr>'
      +'<tr><td>Component</td><td>&gt;24m</td><td>Apartment</td></tr>'
      +'<tr><td>Component</td><td>≤24m</td><td>Villa</td></tr></table>'
      +'<div class="auto-note">A random pattern is picked from the matching pool each time you generate.</div></div>';
    selKeys = []; updateSummary(); return;
  }
  var pool = patterns[selCatName] || {};
  var keys = Object.keys(pool);
  if (!keys.length) { g.innerHTML = '<p class="empty-msg">No patterns in this category</p>'; return; }
  keys.forEach(function(key) {
    var isSel = selKeys.some(function(s){return s.category===selCatName&&s.pattern===key;});
    var card = document.createElement('div');
    card.className = 'pcard' + (isSel ? ' sel' : '');
    var thumb = document.createElement('div'); thumb.className = 'pthumb';
    thumb.innerHTML = '<span class="thumb-ph">' + key.toUpperCase() + '</span>';
    var img = document.createElement('img');
    img.src = 'previews/' + key + '.png';
    img.onload = function(){ thumb.innerHTML = ''; thumb.appendChild(img); };
    if (isSel) { var chk=document.createElement('div');chk.className='chk';chk.textContent='✓';card.appendChild(chk); }
    var lbl = document.createElement('div'); lbl.className = 'plbl'; lbl.textContent = key;
    card.appendChild(thumb); card.appendChild(lbl);
    card.onclick = function(){ toggleCard(selCatName, key, card); };
    g.appendChild(card);
  });
  updateSummary();
}

function toggleCard(cat, key, card) {
  var idx = selKeys.findIndex(function(s){return s.category===cat&&s.pattern===key;});
  if (idx>=0) { selKeys.splice(idx,1); card.classList.remove('sel'); var c=card.querySelector('.chk');if(c)c.remove(); }
  else { selKeys.push({category:cat,pattern:key}); card.classList.add('sel'); var chk=document.createElement('div');chk.className='chk';chk.textContent='✓';card.insertBefore(chk,card.firstChild); }
  updateSummary();
  syncSelectionToRuby();
}

function syncSelectionToRuby() {
  var data = { patterns: selCatName==='auto' ? [] : selKeys };
  su('applyPattern', JSON.stringify(data));
}

function updateSummary() {
  var chipsEl = document.getElementById('sel-chips');
  var hintEl  = document.getElementById('no-sel-hint');
  chipsEl.innerHTML = '';
  if (selCatName === 'auto') {
    hintEl.textContent = '⚡ Auto-select active — Transform All picks randomly';
    return;
  }
  if (!selKeys.length) {
    hintEl.textContent = 'No patterns selected — click cards above to select';
    return;
  }
  hintEl.textContent = '';
  selKeys.forEach(function(s) {
    var chip = document.createElement('div');
    chip.className = 'sel-chip';
    chip.innerHTML = '<span>' + s.pattern + ' <span class="sum-cat">(' + s.category + ')</span></span>';
    var x = document.createElement('button');
    x.className = 'sel-chip-x';
    x.textContent = '×';
    x.title = 'Deselect';
    x.addEventListener('click', (function(cat, key){ return function(){ deselectPattern(cat, key); }; })(s.category, s.pattern));
    chip.appendChild(x);
    chipsEl.appendChild(chip);
  });
  // Clear all button
  var clrBtn = document.createElement('button');
  clrBtn.className = 'sel-clear-btn';
  clrBtn.textContent = 'Clear all';
  clrBtn.onclick = clearSel;
  chipsEl.appendChild(clrBtn);
}

function deselectPattern(cat, key) {
  selKeys = selKeys.filter(function(s){ return !(s.category===cat && s.pattern===key); });
  syncSelectionToRuby();
  renderGrid();
  updateSummary();
}

function clearSel() { selKeys=[]; syncSelectionToRuby(); renderGrid(); updateSummary(); }

var noDetail = false;
function toggleNoDetail() {
  noDetail = !noDetail;
  var btn = document.getElementById('nodtlbtn');
  btn.classList.toggle('active', noDetail);
  su('setNoDetail', JSON.stringify(noDetail));
}

function applyPtn() {
  var data = { patterns: selCatName==='auto' ? [] : selKeys };
  su('applyPattern', JSON.stringify(data));
  var btn=document.getElementById('applybtn'),orig=btn.textContent;
  btn.classList.add('ok'); btn.textContent='✓ Confirmed';
  setTimeout(function(){btn.classList.remove('ok');btn.textContent=orig;},1400);
}

// ── Editor state ──────────────────────────────────────
var edBlocks = [], selBlockIdx = -1, edHistory = [];
var r1=1, r2=0, r3=1;
var edSourceFile = ''; // name of the .mgz file the current pattern came from

function pushHistory() {
  edHistory.push(JSON.stringify(edBlocks));
  if (edHistory.length > 50) edHistory.shift();
  updateUndoBtn();
}
function undoEditor() {
  if (!edHistory.length) return;
  edBlocks = JSON.parse(edHistory.pop());
  if (selBlockIdx >= edBlocks.length) selBlockIdx = edBlocks.length - 1;
  renderBlockList(); renderInspector(); drawISO(); updateUndoBtn();
}
function updateUndoBtn() {
  var btn = document.getElementById('undo-btn');
  if (btn) btn.disabled = edHistory.length === 0;
}

var KEYS = ['x','y','z','w','d','h','mat','detail','face','seg','offset'];
var EXPR_KEYS = ['x','y','z','w','d','h','seg','offset'];
var _blockIdCounter = 1;

function arrToBlock(a) {
  var b = {};
  if (Array.isArray(a)) {
    KEYS.forEach(function(k,i){ b[k] = a[i]; });
  } else {
    KEYS.forEach(function(k){ b[k] = a[k]; });
  }
  b._expr = {};
  EXPR_KEYS.forEach(function(k){
    b._expr[k] = typeof b[k]==='string' && isNaN(parseFloat(b[k]));
  });
  if (!b._id) b._id = _blockIdCounter++;
  return b;
}
function blockToArr(b) { return KEYS.map(function(k){return b[k];}); }

function makeDefault() {
  var firstMat = Object.keys(edClrs)[0] || 'BDY';
  return {x:0,y:0,z:0,w:40,d:40,h:20,mat:firstMat,detail:0,face:0,seg:6,offset:0,_expr:{},_id:_blockIdCounter++};
}

// Find which loaded file a pattern belongs to
function findSourceFile(cat, key) {
  for (var i = 0; i < loadedFiles.length; i++) {
    var f = loadedFiles[i];
    if (f.ptns && f.ptns[cat] && f.ptns[cat][key] !== undefined) return f.name;
  }
  return '';
}

function refreshPtnSel() {
  var catSel = document.getElementById('ptn-cat');
  var ptnSel = document.getElementById('ptn-sel');
  if (!catSel || !ptnSel) return;
  var cat = catSel.value;
  var pool = patterns[cat] || {};
  var keys = Object.keys(pool);
  ptnSel.innerHTML = keys.map(function(k){
    return '<option value="'+k+'">'+k+'</option>';
  }).join('');
  if (!keys.length) ptnSel.innerHTML = '<option value="">— no patterns —</option>';
}

function switchToPattern(key) {
  if (!key) return;
  var cat = document.getElementById('ptn-cat').value;
  var src = (patterns[cat] || {})[key];
  if (!src) return;
  pushHistory();
  edBlocks = src.map(arrToBlock);
  selBlockIdx = 0;
  document.getElementById('ptn-name').value = key;
  edSourceFile = findSourceFile(cat, key);
  updateSrcBadge();
  // Update edClrs from source file's CLRS if available
  for (var i = 0; i < loadedFiles.length; i++) {
    if (loadedFiles[i].name === edSourceFile && loadedFiles[i].clrs) {
      edClrs = normalizeClrs(loadedFiles[i].clrs);
      break;
    }
  }
  renderBlockList(); renderInspector(); drawISO();
}

function updateSrcBadge() {
  var el = document.getElementById('src-file-badge');
  if (el) el.textContent = edSourceFile ? edSourceFile : '';
}

function newPattern() {
  edBlocks = [makeDefault()];
  selBlockIdx = 0;
  edHistory = [];
  edSourceFile = '';
  var firstCat = Object.keys(patterns)[0] || '';
  document.getElementById('ptn-name').value = '';
  document.getElementById('ptn-cat').value = firstCat;
  refreshPtnSel();
  updateSrcBadge();
  document.getElementById('edov').classList.remove('hidden');
  updateUndoBtn();
  renderBlockList(); renderInspector(); drawISODeferred();
}

function receiveAbsorb(blocks, entityName) {
  pushHistory();
  edBlocks = blocks.map(arrToBlock);
  selBlockIdx = 0;
  if (entityName) document.getElementById('ptn-name').value = entityName;
  updateUndoBtn();
  renderBlockList(); renderInspector(); drawISODeferred();
}

function openEditor() {
  var firstCat=Object.keys(patterns)[0]||'';
  var src=null, sname='', scat=selCatName==='auto'?firstCat:selCatName;
  if (selKeys.length) {
    var last=selKeys[selKeys.length-1];
    src=(patterns[last.category]||{})[last.pattern];
    sname=last.pattern; scat=last.category;
  } else if (selCatName!=='auto') {
    var pool=patterns[selCatName]||{},keys=Object.keys(pool);
    if (keys.length) { src=pool[keys[0]]; sname=keys[0]; }
  }
  edBlocks = src ? src.map(arrToBlock) : [makeDefault()];
  selBlockIdx = 0;
  edHistory = [];
  edSourceFile = sname ? findSourceFile(scat, sname) : '';
  // Use source file's CLRS if available
  if (edSourceFile) {
    for (var i = 0; i < loadedFiles.length; i++) {
      if (loadedFiles[i].name === edSourceFile && loadedFiles[i].clrs && Object.keys(loadedFiles[i].clrs).length) {
        edClrs = normalizeClrs(loadedFiles[i].clrs);
        break;
      }
    }
  }
  document.getElementById('ptn-name').value = sname;
  document.getElementById('ptn-cat').value  = scat;
  refreshPtnSel();
  document.getElementById('ptn-sel').value = sname;
  updateSrcBadge();
  document.getElementById('edov').classList.remove('hidden');
  updateUndoBtn();
  renderBlockList(); renderInspector(); drawISODeferred();
}

function closeEditor() { document.getElementById('edov').classList.add('hidden'); }

function addBlock() {
  pushHistory();
  var last=edBlocks.length?edBlocks[edBlocks.length-1]:null;
  var nb=makeDefault();
  if (last) nb.z=(parseNum(last.z)+parseNum(last.h))||0;
  edBlocks.push(nb); selBlockIdx=edBlocks.length-1;
  renderBlockList(); renderInspector(); drawISO();
}

function duplicateBlock() {
  if (selBlockIdx < 0 || selBlockIdx >= edBlocks.length) return;
  pushHistory();
  var src = edBlocks[selBlockIdx];
  var nb = JSON.parse(JSON.stringify(src));
  edBlocks.splice(selBlockIdx + 1, 0, nb);
  selBlockIdx = selBlockIdx + 1;
  renderBlockList(); renderInspector(); drawISO();
}

function moveBlock(dir) {
  if (selBlockIdx < 0) return;
  var to = selBlockIdx + dir;
  if (to < 0 || to >= edBlocks.length) return;
  pushHistory();
  var tmp = edBlocks[selBlockIdx];
  edBlocks[selBlockIdx] = edBlocks[to];
  edBlocks[to] = tmp;
  selBlockIdx = to;
  renderBlockList(); renderInspector(); drawISO();
}

function deleteBlock(idx) {
  pushHistory();
  edBlocks.splice(idx,1);
  if (selBlockIdx>=edBlocks.length) selBlockIdx=edBlocks.length-1;
  renderBlockList(); renderInspector(); drawISO();
}

function deletePattern(cat, key) {
  if (!confirm('Remove pattern "' + key + '" from the session? (Does not delete the .mgz file)')) return;
  if (patterns[cat]) delete patterns[cat][key];
  selKeys = selKeys.filter(function(s){ return !(s.category===cat && s.pattern===key); });
  syncSelectionToRuby();
  su('deletePattern', JSON.stringify({cat: cat, key: key}));
  renderNav(); renderGrid(); updateSummary();
}

function deleteSel() {
  if (!confirm('Delete the selected objects from the SketchUp model?')) return;
  su('deleteSelection');
}

function matColor(mat){ return edClrs[mat] || '#888888'; }
function fmtV(v){if(typeof v==='number')return v;var s=String(v);return s.length>7?s.substring(0,6)+'…':s;}
function blockDimStr(b){return fmtV(b.w)+'×'+fmtV(b.d)+'×'+fmtV(b.h);}

// ── Block list with drop indicator ───────────────────
var dragIdx=-1, dropTgtIdx=-1, dropPos='after';

function renderBlockList() {
  var el=document.getElementById('blitems'); el.innerHTML='';
  edBlocks.forEach(function(b,i){
    var chip=document.createElement('div');
    chip.className='bchip'+(i===selBlockIdx?' active':'');
    chip.draggable=true;
    chip.dataset.idx=i;
    chip.innerHTML='<div class="bchip-drag">&#10783;</div>'
      +'<div class="bchip-dot" style="background:'+matColor(b.mat)+'"></div>'
      +'<div class="bchip-info"><div class="bchip-num">Block '+b._id+'</div>'
      +'<div class="bchip-mat">'+b.mat+'</div>'
      +'<div class="bchip-dim">'+blockDimStr(b)+'</div></div>';
    chip.onclick=function(e){
      if(e.target.classList.contains('bchip-drag'))return;
      if(selBlockIdx===i){selBlockIdx=-1;}else{selBlockIdx=i;}
      renderBlockList();renderInspector();drawISO();
    };
    chip.addEventListener('dragstart',function(e){
      dragIdx=i; e.dataTransfer.setData('text/plain',String(i));
      chip.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
    });
    chip.addEventListener('dragend',function(){
      chip.classList.remove('dragging');
      removeDropIndicator();
      dragIdx=-1; dropTgtIdx=-1;
    });
    chip.addEventListener('dragover',function(e){
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      var rect=chip.getBoundingClientRect();
      dropPos=e.clientY<rect.top+rect.height/2?'before':'after';
      dropTgtIdx=i;
      showDropIndicator(chip, dropPos);
    });
    chip.addEventListener('drop',(function(myI){return function(e){
      e.preventDefault(); removeDropIndicator();
      var src=parseInt(e.dataTransfer.getData('text/plain'));
      var tgt=dropTgtIdx>=0?dropTgtIdx:myI;
      var pos=dropPos;
      if(isNaN(src)||src===tgt){dragIdx=-1;dropTgtIdx=-1;return;}
      pushHistory();
      var moved=edBlocks.splice(src,1)[0];
      var dest=pos==='before'?tgt:tgt+1;
      if(src<dest)dest--;
      edBlocks.splice(dest,0,moved);
      selBlockIdx=dest;
      dragIdx=-1; dropTgtIdx=-1;
      renderBlockList(); renderInspector(); drawISO();
    };})(i));
    el.appendChild(chip);
  });
}

function showDropIndicator(refChip, pos) {
  removeDropIndicator();
  var ind = document.createElement('div');
  ind.className = 'drop-indicator';
  ind.id = 'drop-ind';
  if (pos === 'before') {
    refChip.parentNode.insertBefore(ind, refChip);
  } else {
    refChip.parentNode.insertBefore(ind, refChip.nextSibling);
  }
}
function removeDropIndicator() {
  var ex = document.getElementById('drop-ind');
  if (ex) ex.remove();
}

// ── Inspector ─────────────────────────────────────────
function renderInspector() {
  var el=document.getElementById('inspector');
  if (selBlockIdx<0||selBlockIdx>=edBlocks.length) { el.innerHTML='<p class="no-sel">Select a block to edit</p>'; return; }
  var b=edBlocks[selBlockIdx];
  var ex=b._expr||{};
  var PREVIEW_H = 10;
  var P1KEYS=['x','y','z','w','d','h','seg','offset'];
  var p1={};
  P1KEYS.forEach(function(k){ p1[k]=evalExpr(b[k],r1,r2,r3,PREVIEW_H,null); });
  el.innerHTML=''
    +'<div class="fg"><div class="fg-head">Position</div>'
    +eRow('x',b.x,ex.x,0,80,p1)+eRow('y',b.y,ex.y,0,80,p1)+eRow('z',b.z,ex.z,0,90,p1)+'</div>'
    +'<div class="fg"><div class="fg-head">Size</div>'
    +eRow('w',b.w,ex.w,1,80,p1)+eRow('d',b.d,ex.d,1,80,p1)+eRow('h',b.h,ex.h,1,90,p1)+'</div>'
    +'<div class="fg"><div class="fg-head">Material</div>'
    +'<div class="frow mat-frow"><div class="mat-row" id="mat-row"></div>'
    +'<button class="mat-add-btn" onclick="addMatKey()" title="Add material key">+</button></div></div>'
    +'<div class="fg"><div class="fg-head">Detail</div><div class="frow"><div class="det-row">'
    +'<button class="dchip'+(b.detail===0?' active':'')+'" onclick="setDetail(0)">None</button>'
    +'<button class="dchip'+(b.detail===1?' active':'')+'" onclick="setDetail(1)" title="Horizontal lines">&#8801;</button>'
    +'<button class="dchip'+(b.detail===2?' active':'')+'" onclick="setDetail(2)" title="Vertical lines">|||</button>'
    +'</div></div></div>'
    +(b.detail!==0
      ?'<div class="fg"><div class="fg-head">Detail Options</div>'
        +'<div class="frow"><span class="flbl">Face</span><div class="face-row">'
        +[0,1,2,3,4,5].map(function(f){return '<button class="fachip'+(b.face===f?' active':'')+'" onclick="setFace('+f+')">'+f+'</button>';}).join('')
        +'</div></div>'+eRow('seg',b.seg,ex.seg,2,20,p1)+eRow('offset',b.offset,ex.offset,0,8,p1)+'</div>'
      :'')
    +'<button class="del-btn" onclick="deleteBlock('+selBlockIdx+')">Remove block</button>';
  renderMatRow();
}

function renderMatRow() {
  var el = document.getElementById('mat-row');
  if (!el) return;
  var b = selBlockIdx >= 0 ? edBlocks[selBlockIdx] : null;
  el.innerHTML = Object.keys(edClrs).map(function(m) {
    var hex = edClrs[m] || '#888888';
    var active = b && b.mat === m;
    return '<div class="mchip-wrap'+(active?' active':'')+'" onclick="setMat(\''+m+'\')">'
      +'<input type="color" class="mchip-picker" value="'+hex
      +'" onclick="event.stopPropagation()" oninput="updateMatColor(\''+m+'\',this.value)">'
      +'<span class="mchip-lbl">'+m+'</span></div>';
  }).join('');
}

function eRow(key,val,isExpr,mn,mx,p1fields) {
  var num=typeof val==='number'?val:parseFloat(val)||0;
  var strVal=typeof val==='string'?val:String(num);
  var clamped=Math.min(mx,Math.max(mn,num));
  var PREVIEW_H = 10;
  var badge='';
  if(isExpr){
    var resolved=evalExpr(val,r1,r2,r3,PREVIEW_H,p1fields||null);
    var ok=typeof resolved==='number'&&isFinite(resolved)&&!isNaN(resolved);
    badge='<span class="expr-badge '+(ok?'ok':'err')+'" id="eb-'+key+'">'+(ok?('= '+(Math.round(resolved*100)/100)):'⚠ err')+'</span>';
  }
  return '<div class="frow"><span class="flbl">'+key+'</span><div class="fexpr-wrap">'
    +(isExpr
      ?'<input type="text" class="fexpr-inp expr-mode" value="'+strVal+'" oninput="setFieldExpr(\''+key+'\',this.value)">'+badge
      :'<input type="range" class="fslider" min="'+mn+'" max="'+mx+'" step="1" value="'+clamped+'"'
       +' oninput="setField(\''+key+'\',parseFloat(this.value));document.getElementById(\'fv-'+key+'\').textContent=this.value">'
       +'<span class="fval" id="fv-'+key+'">'+num+'</span>')
    +'<button class="fxtog'+(isExpr?' on':'')+'" onclick="toggleExpr(\''+key+'\')">'+(isExpr?'#':'fx')+'</button>'
    +'</div></div>';
}

function parseNum(v){return typeof v==='number'?v:parseFloat(v)||0;}

function setField(key,val){if(selBlockIdx<0)return;pushHistory();edBlocks[selBlockIdx][key]=val;renderBlockList();drawISO();}
function setFieldExpr(key,val){
  if(selBlockIdx<0)return;
  var n=parseFloat(val);
  edBlocks[selBlockIdx][key]=isNaN(n)?val:n;
  var badge=document.getElementById('eb-'+key);
  if(badge){
    var PREVIEW_H=10;
    var b=edBlocks[selBlockIdx];
    var P1={};['x','y','z','w','d','h','seg','offset'].forEach(function(k){P1[k]=evalExpr(b[k],r1,r2,r3,PREVIEW_H,null);});
    var resolved=evalExpr(b[key],r1,r2,r3,PREVIEW_H,P1);
    var ok=typeof resolved==='number'&&isFinite(resolved)&&!isNaN(resolved);
    badge.className='expr-badge '+(ok?'ok':'err');
    badge.textContent=ok?('= '+Math.round(resolved*100)/100):'⚠ err';
  }
  renderBlockList();drawISO();
}
function toggleExpr(key){
  if(selBlockIdx<0)return;
  pushHistory();
  var b=edBlocks[selBlockIdx];
  if(!b._expr)b._expr={};
  b._expr[key]=!b._expr[key];
  if(!b._expr[key]){var n=parseFloat(b[key]);if(!isNaN(n))b[key]=n;}
  renderInspector();drawISO();
}
function setMat(m){if(selBlockIdx<0)return;pushHistory();edBlocks[selBlockIdx].mat=m;renderBlockList();renderMatRow();drawISO();}
function setDetail(d){if(selBlockIdx<0)return;pushHistory();edBlocks[selBlockIdx].detail=d;renderInspector();}
function setFace(f){if(selBlockIdx<0)return;pushHistory();edBlocks[selBlockIdx].face=f;renderInspector();}

function updateMatColor(key, hex) {
  edClrs[key] = hex;
  renderBlockList();
  renderMatRow();
  drawISO();
}

function addMatKey() {
  var key = (prompt('New material key (e.g. WIN, RF):') || '').trim().toUpperCase();
  if (!key || edClrs[key]) return;
  edClrs[key] = '#888888';
  if (selBlockIdx >= 0) edBlocks[selBlockIdx].mat = key;
  renderInspector();
  drawISO();
}

// ── ISO canvas ────────────────────────────────────────
var canvas=null, ctx=null;
var canvasRot=0;

// Draw after a short delay; if canvas still has no size, retry once more.
function drawISODeferred(){
  setTimeout(function(){
    drawISO();
    // If canvas was 0×0 (editor just became visible), retry after layout settles
    if(canvas && (canvas.width<2 || canvas.height<2)){
      setTimeout(function(){ syncCanvasSize(); drawISO(); }, 120);
    }
  }, 60);
}

function rotateNorm(bl){
  var x=bl.x,y=bl.y,w=bl.w,d=bl.d;
  if(canvasRot===1) return Object.assign({},bl,{x:y,     y:1-x-w, w:d,d:w});
  if(canvasRot===2) return Object.assign({},bl,{x:1-x-w, y:1-y-d, w:w,d:d});
  if(canvasRot===3) return Object.assign({},bl,{x:1-y-d, y:x,     w:d,d:w});
  return bl;
}

function initCanvas(){
  canvas=document.getElementById('iso-canvas');
  ctx=canvas.getContext('2d');
  syncCanvasSize();
}

function syncCanvasSize(){
  if(!canvas) return;
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  var w=Math.round(rect.width*dpr), h=Math.round(rect.height*dpr);
  if(w>4) canvas.width=w;
  if(h>4) canvas.height=h;
}

function evalExpr(v,r1v,r2v,r3v,ph,fields){
  if(typeof v==='number')return v;
  var s=String(v);
  s=s.replace(/lv\(t,([\d.]+)\)/g,function(_,fh){return Math.round(ph/parseFloat(fh));});
  s=s.replace(/\br1\b/g,r1v).replace(/\br2\b/g,r2v).replace(/\br3\b/g,r3v);
  if(fields){
    ['x','y','z','w','d','h','seg','offset'].forEach(function(k){
      if(fields[k]!==undefined) s=s.replace(new RegExp('\\b'+k+'\\b','g'),String(fields[k]));
    });
  }
  try{return Function('"use strict";return('+s+')')();}catch(e){return 10;}
}

function randomize(){r1=Math.round(Math.random());r2=Math.round(Math.random());r3=Math.round(Math.random());drawISO();}

function hexToRgb(hex){
  if(typeof hex==='number') return [(hex>>16)&0xff,(hex>>8)&0xff,hex&0xff];
  if(!hex||typeof hex!=='string'||hex.length<7) return [128,128,128];
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}
function shade(rgb,f){return 'rgb('+Math.round(rgb[0]*f)+','+Math.round(rgb[1]*f)+','+Math.round(rgb[2]*f)+')';}

function syncCanvas(){
  if(!canvas) initCanvas();
  syncCanvasSize();
}

function drawISO(){
  syncCanvas();
  var W=canvas.width, H=canvas.height;
  if(!W||!H) return;
  var ph=10;
  var dpr=window.devicePixelRatio||1;

  var EVAL_KEYS=['x','y','z','w','d','h','seg','offset'];
  var solved=edBlocks.map(function(b){
    var p1={};
    EVAL_KEYS.forEach(function(k){ p1[k]=evalExpr(b[k],r1,r2,r3,ph,null); });
    var p2={};
    EVAL_KEYS.forEach(function(k){ p2[k]=evalExpr(b[k],r1,r2,r3,ph,p1); });
    return{ x:p2.x||0, y:p2.y||0, z:p2.z||0,
      w:Math.max(0.001,p2.w||1), d:Math.max(0.001,p2.d||1), h:Math.max(0.001,p2.h||1),
      mat:b.mat, detail:b.detail||0, seg:Math.max(2,parseInt(p2.seg)||6) };
  });

  var maxX=0.001, maxY=0.001, maxZ=0.001;
  solved.forEach(function(b){
    maxX=Math.max(maxX,b.x+b.w);
    maxY=Math.max(maxY,b.y+b.d);
    maxZ=Math.max(maxZ,b.z+b.h);
  });

  var norm=solved.map(function(b,i){
    return rotateNorm({x:b.x/maxX, y:b.y/maxY, z:b.z/maxZ,
      w:b.w/maxX, d:b.d/maxY, h:b.h/maxZ,
      mat:b.mat, detail:b.detail, seg:b.seg, _origIdx:i});
  });

  var pad=14*dpr;
  var S=Math.min((W-pad*2)/1.732, (H-pad*2)/2);
  var cx=W*0.5, cy=H*0.5;
  function ip(x,y,z){return{x:cx+(x-y)*S*0.866, y:cy+(x+y)*S*0.5-z*S};}

  // ── Z-buffer pixel fill ────────────────────────────────
  var imgData=ctx.createImageData(W,H);
  var px=imgData.data;
  // fill background #f0f4f8
  for(var i=0;i<W*H;i++){px[i*4]=240;px[i*4+1]=244;px[i*4+2]=248;px[i*4+3]=255;}
  var depthBuf=new Float32Array(W*H).fill(-1e9);

  // Rasterize one parallelogram face into the depth buffer.
  // Corners in 3D: c0,c1 define edge-u; c0,c3 define edge-v. c2 = c1+(c3-c0).
  // Depth metric: x+y+z (higher = closer to viewer).
  function rasterFace(c0,c1,c3,r,g,b2){
    var sp0=ip(c0[0],c0[1],c0[2]);
    var sp1=ip(c1[0],c1[1],c1[2]);
    var sp3=ip(c3[0],c3[1],c3[2]);
    var d0=c0[0]+c0[1]+c0[2], d1=c1[0]+c1[1]+c1[2], d3=c3[0]+c3[1]+c3[2];
    var ax=sp1.x-sp0.x, ay=sp1.y-sp0.y;
    var bx=sp3.x-sp0.x, by=sp3.y-sp0.y;
    var det=ax*by-ay*bx;
    if(Math.abs(det)<0.0001) return;
    var inv=1/det;
    var sp2x=sp1.x+bx, sp2y=sp1.y+by;
    var minX=Math.max(0,Math.floor(Math.min(sp0.x,sp1.x,sp2x,sp3.x)));
    var maxX=Math.min(W-1,Math.ceil(Math.max(sp0.x,sp1.x,sp2x,sp3.x)));
    var minY=Math.max(0,Math.floor(Math.min(sp0.y,sp1.y,sp2y,sp3.y)));
    var maxY=Math.min(H-1,Math.ceil(Math.max(sp0.y,sp1.y,sp2y,sp3.y)));
    for(var py2=minY;py2<=maxY;py2++){
      for(var px2=minX;px2<=maxX;px2++){
        var ex=px2-sp0.x, ey=py2-sp0.y;
        var u=(ex*by-ey*bx)*inv;
        var v=(ax*ey-ay*ex)*inv;
        if(u<-0.01||u>1.01||v<-0.01||v>1.01) continue;
        var depth=d0+u*(d1-d0)+v*(d3-d0);
        var idx=py2*W+px2;
        if(depth>depthBuf[idx]){
          depthBuf[idx]=depth;
          var pi4=idx*4;
          px[pi4]=r; px[pi4+1]=g; px[pi4+2]=b2; px[pi4+3]=255;
        }
      }
    }
  }

  norm.forEach(function(bl){
    var rgb=edClrs[bl.mat]?hexToRgb(edClrs[bl.mat]):[100,120,140];
    var x=bl.x,y=bl.y,z=bl.z,w=bl.w,d=bl.d,h=bl.h;
    function sc(f){return [Math.round(rgb[0]*f),Math.round(rgb[1]*f),Math.round(rgb[2]*f)];}
    var cf=sc(0.62), cr=sc(0.78), ct=sc(1.0);
    // front face (y+d): corners c0=(x,y+d,z), c1=(x+w,y+d,z), c3=(x,y+d,z+h)
    rasterFace([x,y+d,z],[x+w,y+d,z],[x,y+d,z+h], cf[0],cf[1],cf[2]);
    // right face (x+w): corners c0=(x+w,y,z), c1=(x+w,y+d,z), c3=(x+w,y,z+h)
    rasterFace([x+w,y,z],[x+w,y+d,z],[x+w,y,z+h], cr[0],cr[1],cr[2]);
    // top face (z+h): corners c0=(x,y,z+h), c1=(x+w,y,z+h), c3=(x,y+d,z+h)
    rasterFace([x,y,z+h],[x+w,y,z+h],[x,y+d,z+h], ct[0],ct[1],ct[2]);
  });

  ctx.putImageData(imgData,0,0);

  // ── Grid overlay ───────────────────────────────────────
  ctx.strokeStyle='rgba(140,160,180,0.5)';ctx.lineWidth=0.7*dpr;
  var gp=[ip(0,0,0),ip(1,0,0),ip(1,1,0),ip(0,1,0)];
  ctx.beginPath();ctx.moveTo(gp[0].x,gp[0].y);
  for(var gi=1;gi<gp.length;gi++)ctx.lineTo(gp[gi].x,gp[gi].y);
  ctx.closePath();ctx.stroke();

  // ── Edge lines + detail lines + selection outline ──────
  function strokePath(pts,style,lw){
    ctx.strokeStyle=style;ctx.lineWidth=lw;
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
    ctx.closePath();ctx.stroke();
  }
  function p2(px2,py2,pz2){return ip(px2,py2,pz2);}

  norm.forEach(function(bl){
    var x=bl.x,y=bl.y,z=bl.z,w=bl.w,d=bl.d,h=bl.h;
    // Thin edges
    strokePath([p2(x,y+d,z),p2(x+w,y+d,z),p2(x+w,y+d,z+h),p2(x,y+d,z+h)],'rgba(0,0,0,0.13)',0.5*dpr);
    strokePath([p2(x+w,y,z),p2(x+w,y+d,z),p2(x+w,y+d,z+h),p2(x+w,y,z+h)],'rgba(0,0,0,0.13)',0.5*dpr);
    strokePath([p2(x,y,z+h),p2(x+w,y,z+h),p2(x+w,y+d,z+h),p2(x,y+d,z+h)],'rgba(0,0,0,0.13)',0.5*dpr);
    // Detail lines
    if(bl.detail!==0&&bl.seg>1){
      ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=0.6*dpr;
      var n=bl.seg;
      for(var s=1;s<n;s++){
        if(bl.detail===1){
          var fz=z+h*s/n;
          ctx.beginPath();var l=p2(x,y+d,fz),rr=p2(x+w,y+d,fz);ctx.moveTo(l.x,l.y);ctx.lineTo(rr.x,rr.y);ctx.stroke();
          ctx.beginPath();l=p2(x+w,y,fz);rr=p2(x+w,y+d,fz);ctx.moveTo(l.x,l.y);ctx.lineTo(rr.x,rr.y);ctx.stroke();
        } else {
          var fx=x+w*s/n;
          ctx.beginPath();var a2=p2(fx,y+d,z),b3=p2(fx,y+d,z+h);ctx.moveTo(a2.x,a2.y);ctx.lineTo(b3.x,b3.y);ctx.stroke();
          var fy=y+d*s/n;
          ctx.beginPath();a2=p2(x+w,fy,z);b3=p2(x+w,fy,z+h);ctx.moveTo(a2.x,a2.y);ctx.lineTo(b3.x,b3.y);ctx.stroke();
        }
      }
    }
    // Selection outline
    if(bl._origIdx===selBlockIdx){
      strokePath([p2(x,y+d,z),p2(x+w,y+d,z),p2(x+w,y+d,z+h),p2(x,y+d,z+h)],'rgba(60,140,255,0.9)',2*dpr);
      strokePath([p2(x+w,y,z),p2(x+w,y+d,z),p2(x+w,y+d,z+h),p2(x+w,y,z+h)],'rgba(60,140,255,0.9)',2*dpr);
      strokePath([p2(x,y,z+h),p2(x+w,y,z+h),p2(x+w,y+d,z+h),p2(x,y+d,z+h)],'rgba(60,140,255,0.9)',2*dpr);
    }
  });
}

// ── Test on selection ─────────────────────────────────
function testPattern(){
  var blocks=edBlocks.map(blockToArr);
  var name=document.getElementById('ptn-name').value.trim();
  var cat=document.getElementById('ptn-cat').value;
  su('testPattern', JSON.stringify({name:name,cat:cat,blocks:blocks}));
  var btn=document.getElementById('test-btn');
  var orig=btn.textContent;
  btn.classList.add('ok');btn.textContent='✓ Applied';
  setTimeout(function(){btn.classList.remove('ok');btn.textContent='▶ Test';},1600);
}

// ── Save / Export ─────────────────────────────────────
function savePattern(){
  var name=document.getElementById('ptn-name').value.trim();
  if(!name){document.getElementById('ptn-name').focus();return;}
  var cat=document.getElementById('ptn-cat').value;
  var blocks=edBlocks.map(blockToArr);
  var content={CLRS:edClrs,PTNS:{}};
  content.PTNS[cat]={};content.PTNS[cat][name]=blocks;
  su('saveMgz', JSON.stringify({name:name,content:content}));
}

function exportMgz(){
  var name=document.getElementById('ptn-name').value.trim()||'pattern';
  var cat=document.getElementById('ptn-cat').value;
  var blocks=edBlocks.map(blockToArr);
  su('exportMgz', JSON.stringify({name:name,cat:cat,blocks:blocks,clrs:edClrs}));
}

// ── Init ──────────────────────────────────────────────
window.onload = function(){ initPatterns(); };
window.addEventListener('resize',function(){if(canvas)drawISO();});
document.addEventListener('keydown',function(e){
  if(e.metaKey && e.key==='w'){ e.preventDefault(); su('closeDialog',''); }
});
